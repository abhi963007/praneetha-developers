            {
              mobile: '(max-width: 479px)',

              tablet: '(min-width: 768px) and (max-width: 991px)',
              desktop: '(min-width: 992px)',

            function (context) {
              var cond = context.conditions || {};
              document.querySelectorAll('[data-parallax="trigger"]').forEach(function (trigger) {
                var disable = trigger.getAttribute('data-parallax-disable');
                if (
                  (disable === 'mobile' && cond.mobile) ||
                  (disable === 'mobileLandscape' && cond.mobileLandscape) ||
                  (disable === 'tablet' && cond.tablet) ||

                var target = trigger.querySelector('[data-parallax="target"]') || trigger;
                var direction = trigger.getAttribute('data-parallax-direction') || 'vertical';

                var startValue = parseFloat(trigger.getAttribute('data-parallax-start')) || 0;
                var endValue = parseFloat(trigger.getAttribute('data-parallax-end')) || -15;
                var scrubAttribute = trigger.getAttribute('data-parallax-scrub');
                var scrub = scrubAttribute !== null ? parseFloat(scrubAttribute) : true;
                var scrollStart = trigger.getAttribute('data-parallax-scroll-start') || 'top bottom';
                var scrollEnd = trigger.getAttribute('data-parallax-scroll-end') || 'bottom top';

                window.gsap.fromTo(
